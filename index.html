<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Young Professional Programma · Zig</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
<style>
:root{
 --blue:#1F59FF;--blue-deep:#0B34D6;--blue-x:#0000D0;--cyan:#00D0FF;--navy:#1C2030;
 --bg:#EDF3F9;--surface:#FFFFFF;--surface2:#F4F8FD;
 --text:#1C2030;--dim:#5B6472;--border:#E4EBF4;
 --shadow:0 8px 30px rgba(28,32,48,.08);
 --green:#12B76A;--amber:#F79009;--red:#F04438;--grey:#98A2B3;--radius:22px;
}
@media (prefers-color-scheme: dark){
 :root{--bg:#0E1220;--surface:#161B29;--surface2:#1E2434;--text:#EAF0FA;--dim:#98A4BC;--border:#2A3247;--shadow:0 8px 30px rgba(0,0,0,.4);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Safiro","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 70px}
.topbar{background:linear-gradient(120deg,var(--blue) 0%,var(--blue-deep) 60%,var(--blue-x) 100%);color:#fff;border-radius:0 0 28px 28px;padding:20px 0 18px;box-shadow:0 10px 30px rgba(11,52,214,.25)}
.topbar .wrap{padding-bottom:0}
.thead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:36px;filter:brightness(0) invert(1);flex:0 0 auto}
.ttitle{flex:1 1 auto;min-width:200px}
.ttitle h1{font-size:20px;line-height:1.1}
.ttitle .sub{opacity:.92;font-size:12.5px;margin-top:3px;font-weight:600}
.userchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);padding:7px 10px 7px 7px;border-radius:16px}
.userchip .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.userchip .un{font-weight:800;font-size:13px;line-height:1.1}
.userchip .ur{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.linkbtn{background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 11px;font-weight:700;font-size:12px}
.store-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.store-badge .sd{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.store-badge.local .sd{background:#FFD166}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.12);color:#fff;padding:10px 18px;border-radius:14px 14px 0 0;font-weight:700;font-size:14px;opacity:.8}
.tab.on{background:var(--bg);color:var(--blue);opacity:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.cyan{background:var(--cyan);color:#062a33}
.btn.block{width:100%;justify-content:center;display:flex;align-items:center;gap:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--dim)}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(130deg,var(--blue) 0%,var(--blue-deep) 55%,var(--blue-x) 100%)}
.loginbox{background:var(--surface);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:min(440px,100%);padding:30px 28px;text-align:center}
.loginbox .lg{height:40px;margin-bottom:16px}
.loginbox h1{font-size:22px}
.loginbox p{color:var(--dim);font-size:13px;margin:6px 0 20px}
.msbtn{background:#2F2F2F;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.demo-sep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 14px}
.demo-sep::before,.demo-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.demorow{display:flex;flex-direction:column;gap:8px;text-align:start}
.demobtn{display:flex;align-items:center;gap:11px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 13px;color:var(--text);font-weight:700;font-size:13px;transition:.14s}
.demobtn:hover{border-color:var(--blue);transform:translateY(-1px)}
.demobtn .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
.demobtn small{display:block;font-weight:600;color:var(--dim);font-size:11px}
/* planning */
.phaserow{display:flex;gap:10px;overflow-x:auto;padding:16px 0 6px}
.phase{flex:0 0 auto;min-width:150px;max-width:220px;border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;transition:.15s;border:0}
.phase:hover{transform:translateY(-2px)}
.phase .ph{font-size:11px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.phase .pt{font-size:13px;font-weight:700;margin-top:3px;line-height:1.25}
.phase .pw{font-size:11px;opacity:.85;margin-top:6px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.filters .grow{flex:1 1 200px}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer}
.chk input{width:auto}
.week{margin-bottom:14px;overflow:hidden}
.week.now{outline:2px solid var(--blue);outline-offset:0}
.whead{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border)}
.wstripe{width:8px;align-self:stretch;border-radius:8px;min-height:34px}
.wtitle{font-weight:800;font-size:15px}
.wsub{font-size:12px;color:var(--dim);font-weight:600}
.nowbadge{background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border)}
.day{background:var(--surface);padding:11px 12px;min-height:108px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:5px;border:0;text-align:start;font:inherit;color:inherit;width:100%}
.day:hover{background:var(--surface2)}
.day.na{opacity:.5;cursor:default}
.day.na:hover{background:var(--surface)}
.day.vervallen{opacity:.5}
.day.vervallen .dtitle{text-decoration:line-through;text-decoration-color:var(--grey)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dname{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.ddate{font-size:10px;color:var(--dim);font-weight:600}
.dtitle{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dfoot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.mini{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-flex;gap:3px;align-items:center}
.mini.fb{background:rgba(31,89,255,.12);color:var(--blue)}
.mini.cal{background:rgba(0,208,255,.16);color:#0a7c93}
.mini.att{background:rgba(18,183,106,.14);color:#0a7a48}
.mini.trn{background:rgba(0,208,255,.16);color:#0a7c93}
.mini.loc{background:rgba(0,208,255,.16);color:#0a7c93}
.mini.locon{background:var(--surface2);color:var(--dim)}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,94vw);background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dhead{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px}
.dbody{padding:18px 20px;overflow-y:auto;flex:1}
.x{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.segb{padding:7px 12px;border-radius:10px;font-weight:700;font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.fbitem{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.fbtop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px}
.rate span{cursor:pointer}
.sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:18px 0 8px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.kpi{padding:16px 18px}
.kpi .n{font-size:28px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--dim);font-weight:700;margin-top:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tcard{padding:16px 18px;cursor:pointer;transition:.14s}
.tcard:hover{transform:translateY(-2px);border-color:var(--blue)}
.tcard .th{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.tcard .big{width:44px;height:44px;font-size:16px}
.progrow{display:flex;align-items:center;gap:12px;margin:9px 0}
.progrow .pl{width:210px;font-size:12.5px;font-weight:700;flex:0 0 auto}
.bar{flex:1;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px}
.tstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.tstat div{font-size:12px}
.tstat b{font-size:16px;display:block}
.sh{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border)}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.mgr{background:rgba(31,89,255,.14);color:var(--blue)}
.tag.stk{background:rgba(0,208,255,.16);color:#0a7c93}
.tag.tr{background:rgba(18,183,106,.14);color:#0a7a48}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{background:var(--surface2);border:1px dashed var(--border);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--dim);margin:14px 0}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--text);margin:16px 0 4px}
.itsetup{margin-top:20px;text-align:start;background:var(--surface2);border:1px solid var(--border);border-radius:14px}
.itsetup summary{cursor:pointer;font-weight:800;font-size:12.5px;padding:12px 14px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:7px}
.itsetup summary::-webkit-details-marker{display:none}
.itsetup summary::before{content:"⚙";font-size:14px}
.itsetup[open] summary{border-bottom:1px solid var(--border)}
.itsetup ol{margin:12px 0;padding-inline-start:24px}
.itsetup li{font-size:12px;line-height:1.55;margin-bottom:9px;color:var(--text)}
.itsetup code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font-size:11px;word-break:break-all}
.itsetup .free{margin:0 14px 12px;font-size:11px;color:var(--green);font-weight:700;background:rgba(18,183,106,.1);border-radius:9px;padding:8px 10px}
.admgrid{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:center}
.admfilter{display:grid;grid-template-columns:1fr 200px;gap:8px;align-items:center;margin-bottom:12px}
/* ================= Responsief: tablets & telefoons ================= */
@media(max-width:1024px){
 .wrap{padding:0 16px 64px}
 .progrow .pl{width:170px}
 .phaserow{-webkit-overflow-scrolling:touch}
}
@media(max-width:720px){
 .wrap{padding:0 14px 60px}
 .topbar{padding:16px 0 14px;border-radius:0 0 22px 22px}
 .thead{gap:12px}
 .logo{height:30px}
 .ttitle{min-width:140px}
 .ttitle h1{font-size:18px}
 .tabs{gap:5px;margin-top:14px}
 .tab{padding:9px 14px;font-size:13px}
 .days{grid-template-columns:repeat(2,1fr)}
 .day{min-height:96px}
 .progrow{gap:9px}
 .progrow .pl{width:120px;font-size:12px}
 .kpi .n{font-size:24px}
 .drawer{width:min(560px,96vw)}
 .dhead,.dbody{padding-left:16px;padding-right:16px}
 .loginbox{padding:26px 18px}
 /* Voorkomt dat iOS/Safari inzoomt zodra je een invoerveld aantikt */
 input,select,textarea{font-size:16px}
 .admgrid{grid-template-columns:1fr 1fr}
 .admfilter{grid-template-columns:1fr 160px}
}
@media(max-width:460px){
 .wrap{padding:0 12px 56px}
 .thead{gap:10px}
 .userchip{padding:6px 9px 6px 6px}
 .userchip .un{font-size:12px}
 .tab{padding:8px 12px;font-size:12.5px}
 .day{min-height:88px;padding:9px 10px}
 .dtitle{-webkit-line-clamp:4}
 .drawer{width:100vw}
 .kpis{gap:10px}
 .filters{gap:8px}
 .btn.sm{padding:7px 12px}
 .admgrid{grid-template-columns:1fr}
 .admfilter{grid-template-columns:1fr}
}
</style></head><body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<div class="drawer" id="drawer"><div id="drawerInner"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================================================================
   Young Professional Programma — Portaal · Zig
   Web-app met Microsoft-SSO (MSAL) en rol-gebaseerde weergave.
   - Trainee: eigen planning, status/aanwezigheid, feedback, Outlook.
   - Manager: dashboard met voortgang per trainee + feedback per sessie.
   Draait standaard in DEMO-modus (voorbeeldprofielen). Zodra IT de
   Entra client-ID invult, logt iedereen in via echte Microsoft-SSO tegen
   de Zig-tenant (Zig AD) en werkt de app met Microsoft Graph (agenda +
   SharePoint-opslag). Toegang is beperkt tot een geselecteerde groep.
   Alles valt binnen de bestaande Microsoft 365-licenties — geen extra kosten.
   ================================================================ */

const CONFIG = {
  auth: {
    enabled: true,                  // SSO staat klaar; wordt actief zodra clientId is ingevuld
    clientId: "405eb1a6-e0db-43ec-8f17-a3fabadeaa97", // <<< IT vult hier de Application (client) ID in uit de Entra app-registratie.
                                    //     Kan ook zonder de code te wijzigen via de URL:
                                    //     ...YP-Portaal.html?clientId=<GUID>
    tenantId: "zig.nl"              // Zig-tenant (mag ook de Directory/tenant-ID GUID zijn)
  },
  graph: { scopes: ["User.Read","Calendars.ReadWrite","Sites.ReadWrite.All"] },
  sharepoint: {                     // gedeelde opslag via Microsoft Graph — site: Zig|Academy
    siteHost: "zigsoftware.sharepoint.com",
    sitePath: "/teams/Academy",
    progressList: "YP_Progress",
    feedbackList: "YP_Feedback",
    accessList: "YP_Access",       // gedeelde lijst met toegestane gebruikers (beheermodule)
    assignList: "YP_Assign",       // gedeelde lijst met trainer-toewijzing per sessie (Wi, Day, TrainerEmail, TrainerName)
    configList: "YP_Config"        // gedeelde config (o.a. aanpasbare jaarplanning) — item Title 'planning', veld Data (JSON)
  },
  // --- Toegang beperken tot een selecte groep managers en medewerkers ---
  // Kosteloos: app-registratie en SSO vallen onder Microsoft Entra ID Free
  // (inbegrepen in de M365-licenties die Zig al heeft). Twee lagen, combineerbaar:
  //  1) HARDE grens in Entra: op de bedrijfstoepassing 'Toewijzing vereist = Ja'
  //     zetten en de gekozen personen toewijzen (aanbevolen).
  //  2) In-app vangnet: 'allowlist' hieronder vullen met e-mailadressen. Blijft de
  //     lijst leeg, dan vertrouwt de app op de Entra-toewijzing.
  access: {
    restrict: true,                 // true = alleen toegestane personen/rollen komen binnen
    allowedRoles: ["Manager","Trainer","Young Professional"],  // Entra app-rollen die toegang geven (indien in gebruik)
    allowlist: [                    // optioneel: e-mails met toegang (naast Entra-toewijzing)
      // "voornaam.achternaam@zig.nl",
    ],
    contact: "jarno.cislo@zig.nl"   // waar de knop 'Toegang aanvragen' heen mailt
  },
  managers: [                       // e-mails met managerrol (naast Entra app-rol "Manager")
    "jarno.cislo@zig.nl","andrew.delahaije@zig.nl","leonie.ginus-dejong@zig.nl"
  ],
  trainers: [                       // e-mails met trainerrol (naast Entra app-rol "Trainer" of de beheerlijst)
    // "trainer@zig.nl"
  ],
  tz: "W. Europe Standard Time"
};

/* Laat IT de app configureren zonder de code te wijzigen, bv. voor een pilot:
   ...YP-Portaal.html?clientId=<GUID>&tenantId=<zig.nl of GUID>
   De waarde wordt in deze browser onthouden. Een client-ID is openbaar/niet-geheim. */
(function(){try{
  const qs=new URLSearchParams(location.search);
  if(qs.get("clientId"))localStorage.setItem("yp_clientId",qs.get("clientId"));
  if(qs.get("tenantId"))localStorage.setItem("yp_tenantId",qs.get("tenantId"));
  const cid=qs.get("clientId")||localStorage.getItem("yp_clientId");
  const tid=qs.get("tenantId")||localStorage.getItem("yp_tenantId");
  if(cid)CONFIG.auth.clientId=cid;

function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(n){return (n||"?").replace(/\(demo\)/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();}
function firstLine(t){return (t||"").split("\n")[0];}
function colorFor(str){let h=0;for(let i=0;i<(str||"").length;i++)h=(h*31+str.charCodeAt(i))%360;return "hsl("+h+",62%,52%)";}
function sessDate(i,day){const b=new Date((S.cohortStart||"2026-08-31")+"T00:00:00");b.setDate(b.getDate()+i*7+day+(i>=17?7:0));return b;}
function fmt(d){return d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function fmtShort(d){return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"});}
function todayW(){const b=new Date((S.cohortStart||"2026-08-31")+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);let d=Math.floor((t-b)/(7*864e5));if(d<0)return -1;if(d<17)return d;if(d===17)return -1;const i=d-1;return i<52?i:-1;}

   if((p.loc||"onsite")==="remote")remote++;else onsite++;
 }
 const src=fbSource||S.feedback||[];
 const fb=src.filter(f=>f.tid===tid);
 const rated=fb.filter(f=>f.rt);const avg=rated.length?(rated.reduce((a,f)=>a+f.rt,0)/rated.length):0;
 return {total,done,pct:total?Math.round(done/total*100):0,attPct:tracked?Math.round(present/tracked*100):null,fb:fb.length,avg,onsite,remote};
}

/* Zoekt een handmatig toegevoegde gebruiker (beheermodule) op e-mail. */
function accessUser(email){const e=(email||"").toLowerCase();return ((S&&S.access)||[]).find(u=>(u.email||"").toLowerCase()===e)||null;}
function roleFor(email,roles){
 const rl=(roles||[]).map(r=>String(r).toLowerCase());
 const em=(email||"").toLowerCase();
 const u=accessUser(email);const urole=u?String(u.role).toLowerCase():"";
 if(rl.indexOf("manager")>=0||CONFIG.managers.map(m=>m.toLowerCase()).indexOf(em)>=0||urole==="manager")return "manager";
 if(rl.indexOf("trainer")>=0||(CONFIG.trainers||[]).map(m=>m.toLowerCase()).indexOf(em)>=0||urole==="trainer")return "trainer";
 return "trainee";
}
/* Bepaalt of een aangemelde gebruiker toegang heeft (selecte groep) en met welke rol.
   Toegang = vaste beheerder, óf staat in de beheermodule-lijst, óf in CONFIG.allowlist,
   óf heeft een toegestane Entra app-rol. Zijn alle lijsten leeg, dan vertrouwt de app op
   de Entra-toewijzing ('Toewijzing vereist'). */
function classify(email,roles){
 const role=roleFor(email,roles);                 // "manager" of "trainee"
 const A=CONFIG.access||{};
 if(!A.restrict)return {allowed:true,role};        // restrictie uit → iedereen die inlogt mag erin
 const em=(email||"").toLowerCase();
 const rl=(roles||[]).map(r=>String(r).toLowerCase());
 const cfgList=(A.allowlist||[]).map(x=>x.toLowerCase());
 const beheer=((S&&S.access)||[]).map(u=>(u.email||"").toLowerCase());
 const roleOk=(A.allowedRoles||[]).some(r=>rl.indexOf(String(r).toLowerCase())>=0);
 const isStaff=role==="manager"||role==="trainer";
 const hasList=cfgList.length||beheer.length;
 const allowed = hasList ? (isStaff||cfgList.indexOf(em)>=0||beheer.indexOf(em)>=0||roleOk) : true;
 return {allowed,role};
}

 const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
 const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="YP-feedback.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast("Feedback geëxporteerd");

/* ================= Jaarplanning: export / import (Excel/CSV) ================= */
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("xlsx"));document.head.appendChild(s);});}
function downloadCsvRows(name,rows){const csv=rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\r\n");const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function parseCsv(text){text=text.replace(/^﻿/,"");const nl=text.indexOf("\n");const first=nl>=0?text.slice(0,nl):text;const delim=(first.split(";").length>first.split(",").length)?";":",";const rows=[];let row=[],field="",q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=ch;}else{if(ch==='"')q=true;else if(ch===delim){row.push(field);field="";}else if(ch==="\n"){row.push(field);rows.push(row);row=[];field="";}else if(ch==="\r"){}else field+=ch;}}if(field.length||row.length){row.push(field);rows.push(row);}return rows;}
function planningRows(){const rows=[["Week","Datum","Maand","Fase","Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag"]];(S.weeks||[]).forEach(w=>{const r=[w.w,w.d,w.m,w.p];for(let day=0;day<5;day++){const se=w.s[day]||{t:"",na:true};r.push(se.na?"n.v.t.":se.t);}rows.push(r);});return rows;}
function rowsToWeeks(rows){const out=[];for(let r=1;r<rows.length;r++){const row=rows[r]||[];if(row.every(c=>String(c==null?"":c).trim()===""))continue;const s=[];for(let c=4;c<=8;c++){const v=(row[c]==null?"":String(row[c])).trim();const na=(v===""||/^n\.?\s*v\.?\s*t\.?$/i.test(v));s.push({t:na?"n.v.t.":v,na});}out.push({s});}return out;}
function mergePlanning(newWeeks){const today=new Date();today.setHours(0,0,0,0);let updated=0,kept=0;for(let i=0;i<S.weeks.length;i++){const nw=newWeeks[i];for(let day=0;day<5;day++){const occurred=sessDate(i,day)<today;if(occurred){kept++;continue;}if(nw&&nw.s&&nw.s[day]){S.weeks[i].s[day]={t:nw.s[day].t,na:!!nw.s[day].na};updated++;}}}return {updated,kept};}
async function exportPlanning(){const rows=planningRows();try{const XLSX=await loadXLSX();const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Planning");XLSX.writeFile(wb,"YP-jaarplanning.xlsx");toast("Huidige planning geëxporteerd (.xlsx)");}catch(e){downloadCsvRows("YP-jaarplanning.csv",rows);toast("Huidige planning geëxporteerd (.csv)");}}
async function importPlanning(file){if(!file)return;const nm=(file.name||"").toLowerCase();try{let rows;if(nm.endsWith(".csv")){rows=parseCsv(await file.text());}else{const XLSX=await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1});}if(!rows||rows.length<2){toast("Geen planningsrijen gevonden in het bestand");return;}const res=mergePlanning(rowsToWeeks(rows));await Store.savePlanning();render();toast(res.updated+" toekomstige sessies bijgewerkt · "+res.kept+" reeds plaatsgevonden behouden");}catch(e){toast("Inlezen mislukt — gebruik het geëxporteerde sjabloon en behoud de kolommen");}}

 // voortgang per fase (aggregaat)
 h+='<div class="card" style="padding:18px;margin-top:18px"><h3 style="font-size:15px;margin-bottom:12px">Voortgang per fase (alle young professionals)</h3>';
 (S.phases||[]).forEach(p=>{let tot=0,done=0;S.weeks.filter(w=>w.p===p.id).forEach(w=>w.s.forEach((se,day)=>{if(se.na)return;ts.forEach(t=>{tot++;if(prog(t.id,w.i,day).st==="done")done++;});}));const pct=tot?Math.round(done/tot*100):0;h+='<div class="progrow"><div class="pl">'+esc(p.head)+' · '+esc(p.title)+'</div><div class="bar"><i style="width:'+pct+'%;background:'+p.color+'"></i></div><div style="width:56px;text-align:end;font-weight:700;font-size:12px">'+pct+'%</div></div>';});

  +'<div class="progrow"><div class="pl">Remote</div><div class="bar"><i style="width:'+_rp+'%;background:var(--cyan)"></i></div><div style="width:70px;text-align:end;font-weight:700;font-size:12px">'+s.remote+'</div></div>'
  +'</div>';
 const forYou=(S.feedback||[]).filter(f=>f.tid===me.id&&(f.r==="Manager"||f.r==="Trainer")).sort((a,b)=>(b.dt||"").localeCompare(a.dt||""));
 h+='<div class="sect">Feedback voor jou ('+forYou.length+')</div>';
 if(!forYou.length)h+='<div class="muted" style="font-size:13px">Nog geen feedback van je manager of trainer.</div>';
 else forYou.forEach(f=>{h+=fbCardFull(f,false);});
 h+='<div style="margin-top:16px"><button class="btn ghost sm" data-act="tab" data-tab="planning">Naar mijn planning →</button></div>';
 return h;
}
/* Feedbackkaart met sessie-/algemene context (dashboards + trainee-detail). */
function fbCardFull(f,canDel){
 const overall=f.wi<0;const w=overall?null:S.weeks[f.wi];
 const ref=overall?"Algemene feedback":((w?w.w:"")+" · "+DAYS[f.day]+" · "+fmtShort(sessDate(f.wi,f.day))+" — "+firstLine(w?w.s[f.day].t:""));
 const av=f.r==="Manager"?"var(--blue)":f.r==="Trainer"?"var(--cyan)":colorFor(f.a);
 return '<div class="fbitem"><div class="fbtop"><div class="avatar" style="background:'+av+'">'+initials(f.a)+'</div><div style="flex:1"><div style="font-weight:800;font-size:13px">'+esc(f.a)+' <span class="muted" style="font-weight:600">· '+esc(f.r)+'</span></div><div class="muted" style="font-size:11px">'+esc(ref)+' · '+esc(f.dt)+'</div></div>'+(f.rt?'<div class="stars" title="'+f.rt+'/5">'+stars(f.rt)+'</div>':"")+'</div><div style="font-size:13px;white-space:pre-wrap">'+esc(f.c)+'</div>'+(canDel?'<div style="text-align:end;margin-top:6px"><button class="btn ghost sm" data-act="delFb" data-fid="'+f.id+'">Verwijderen</button></div>':"")+'</div>';
}
/* Formulier voor algemene (ontwikkel)feedback aan een trainee — manager/trainer. */
function fbFormOverall(tid){
 return '<div class="card" style="padding:14px;margin-top:4px"><div style="font-weight:800;margin-bottom:8px">Feedback geven aan deze young professional</div><input id="ofbName" placeholder="Naam" value="'+esc(me.name)+'" style="margin-bottom:8px"><div class="rate" style="font-size:22px;color:var(--amber);margin-bottom:8px">'+[1,2,3,4,5].map(n=>'<span data-act="rate" data-n="'+n+'">'+(n<=UI.curRate?"★":"☆")+'</span>').join("")+'</div><textarea id="ofbText" rows="3" placeholder="Ontwikkelfeedback voor deze young professional…"></textarea><div style="margin-top:8px"><button class="btn" data-act="submitOverall" data-tid="'+esc(tid)+'">Feedback plaatsen</button></div><div class="muted" style="font-size:11px;margin-top:6px">Zichtbaar voor de young professional (op het dashboard) en voor managers.</div></div>';
}

/* ---------- Manager: beheer (toegang / gebruikers) ---------- */
function viewAdmin(){
 const users=(S.access||[]).slice().sort((a,b)=>((a.name||a.email)||"").localeCompare((b.name||b.email)||""));
 const graph=Store.mode==="graph";
 let h='<div class="card" style="padding:16px 18px;margin-top:18px"><h2 style="font-size:18px">Beheer — toegang tot het portaal</h2>'
  +'<div class="muted" style="margin-top:4px">Voeg hier de managers en medewerkers toe die toegang krijgen. Zij loggen daarna in met hun eigen Zig-account (SSO). Wie niet in de lijst staat, krijgt een &bdquo;Geen toegang&rdquo;-scherm.</div>'
  +(graph?'':'<div class="hint" style="margin-top:12px">De app draait nu zonder gedeelde opslag (demo). Wijzigingen gelden alleen in deze browser. Zodra IT SharePoint koppelt (lijst <b>'+esc(CONFIG.sharepoint.accessList)+'</b>), geldt de lijst automatisch voor iedereen.</div>')
  +'</div>';
 h+='<div class="card" style="padding:16px 18px;margin-top:12px"><div style="font-weight:800;margin-bottom:10px">Nieuwe gebruiker toevoegen</div>'
  +'<div class="admgrid">'
  +'<input id="auName" placeholder="Naam">'
  +'<input id="auEmail" type="email" placeholder="e-mail@zig.nl">'
  +'<select id="auRole"><option value="trainee">Young Professional</option><option value="trainer">Trainer</option><option value="manager">Manager</option></select>'
  +'<button class="btn" data-act="addUser">Toevoegen</button>'
  +'</div>'
  +'<div class="muted" style="font-size:11.5px;margin-top:8px">Rol bepaalt de weergave: een <b>young professional</b> ziet de eigen voortgang en feedback; een <b>trainer</b> ziet het programma, verifieert aanwezigheid en geeft feedback; een <b>manager</b> ziet alles en beheert de toegang.</div></div>';
 // --- Bestaande gebruikers beheren ---
 const cnt={manager:0,trainer:0,trainee:0};
 users.forEach(u=>{const r=String(u.role).toLowerCase();if(cnt[r]!=null)cnt[r]++;});
 const q=(UI.admQ||"").trim().toLowerCase();
 const shown=users.filter(u=>{
   if(UI.admRole!=="all"&&String(u.role).toLowerCase()!==UI.admRole)return false;
   if(!q)return true;
   return ((u.name||"")+" "+(u.email||"")).toLowerCase().indexOf(q)>=0;
 });
 h+='<div class="card" style="padding:16px 18px;margin-top:12px">'
  +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px">'
  +'<div style="font-weight:800">Gebruikers beheren</div>'
  +'<span class="muted" style="font-size:12px">'+users.length+' totaal · '+cnt.manager+' manager'+(cnt.manager===1?'':'s')+' · '+cnt.trainer+' trainer'+(cnt.trainer===1?'':'s')+' · '+cnt.trainee+' young professional'+(cnt.trainee===1?'':'s')+'</span></div>'
  +'<div class="muted" style="font-size:12.5px;margin-bottom:10px">Pas hier de naam of rol van een bestaande gebruiker aan, of verwijder iemand uit de app. Wie je verwijdert, verliest direct toegang en krijgt bij een volgende aanmelding het &bdquo;Geen toegang&rdquo;-scherm.</div>'
  +'<div class="admfilter">'
  +'<input id="admQ" data-act="admSearch" placeholder="Zoek op naam of e-mail" value="'+esc(UI.admQ||"")+'">'
  +'<select data-act="admRole">'
   +'<option value="all"'+(UI.admRole==="all"?' selected':'')+'>Alle rollen</option>'
   +'<option value="trainee"'+(UI.admRole==="trainee"?' selected':'')+'>Young Professionals</option>'
   +'<option value="trainer"'+(UI.admRole==="trainer"?' selected':'')+'>Trainers</option>'
   +'<option value="manager"'+(UI.admRole==="manager"?' selected':'')+'>Managers</option>'
  +'</select></div>';
 if(!users.length)h+='<div class="muted" style="font-size:13px;padding:6px 0">Nog geen gebruikers toegevoegd. De vaste beheerders houden sowieso toegang.</div>';
 else if(!shown.length)h+='<div class="empty">Geen gebruikers gevonden met deze zoekopdracht.</div>';
 else h+=shown.map(u=>{
   const nm=u.name||u.email;const rl=String(u.role).toLowerCase();const uid=esc(u.id||"");
   const editing=UI.admEdit&&(UI.admEdit===(u.id||u.email));
   const tg=rl==="manager"?'<span class="tag mgr">Manager</span>':rl==="trainer"?'<span class="tag stk">Trainer</span>':'<span class="tag tr">Young Professional</span>';
   const self=me&&me.email&&(u.email||"").toLowerCase()===String(me.email).toLowerCase();
   if(editing){
     return '<div style="border:1px solid var(--blue);border-radius:12px;margin-bottom:8px;padding:11px 12px">'
      +'<div class="muted" style="font-size:11.5px;margin-bottom:7px">Bewerken — '+esc(u.email)+'</div>'
      +'<div class="admgrid">'
      +'<input id="edName" value="'+esc(nm)+'" placeholder="Naam">'
      +'<select id="edRole">'
        +'<option value="trainee"'+(rl==="trainee"?' selected':'')+'>Young Professional</option>'
        +'<option value="trainer"'+(rl==="trainer"?' selected':'')+'>Trainer</option>'
        +'<option value="manager"'+(rl==="manager"?' selected':'')+'>Manager</option>'
      +'</select>'
      +'<button class="btn sm" data-act="saveUser" data-uid="'+uid+'" data-uemail="'+esc(u.email)+'">Opslaan</button>'
      +'<button class="btn ghost sm" data-act="cancelEditUser">Annuleren</button>'
      +'</div></div>';
   }
   return '<div class="sh" style="border:1px solid var(--border);border-radius:12px;margin-bottom:8px;padding:9px 12px"><div class="avatar" style="background:'+colorFor(nm)+'">'+initials(nm)+'</div>'
    +'<div style="flex:1;min-width:0"><div style="font-weight:700">'+esc(nm)+(self?' <span class="muted" style="font-weight:600;font-size:11px">(jij)</span>':'')+'</div><div class="muted" style="font-size:12px">'+esc(u.email)+'</div></div>'
    +tg
    +'<button class="btn ghost sm" style="margin-inline-start:8px" data-act="editUser" data-uid="'+uid+'" data-uemail="'+esc(u.email)+'">Bewerken</button>'
    +'<button class="btn ghost sm" style="margin-inline-start:6px" data-act="delUser" data-uid="'+uid+'" data-uemail="'+esc(u.email)+'">Verwijderen</button></div>';
 }).join("");
 h+='</div>';
 h+='<div class="hint" style="margin-top:12px"><b>Samen met SSO:</b> deze lijst bepaalt wie ná het inloggen toegang krijgt. Voor een harde grens kan IT in Entra daarnaast &bdquo;Toewijzing vereist&rdquo; aanzetten. Combineer beide voor de strengste beveiliging.</div>';
 // --- Jaarplanning aanpassen ---
 h+='<div class="card" style="padding:16px 18px;margin-top:12px"><div style="font-weight:800;margin-bottom:6px">Jaarplanning aanpassen</div>'
  +'<div class="muted" style="font-size:12.5px;margin-bottom:10px">Exporteer de huidige planning, pas de activiteiten aan in Excel en lees het bestand weer in. Alleen sessies op datums die <b>nog niet hebben plaatsgevonden</b> worden overschreven; reeds plaatsgevonden sessies blijven ongewijzigd — inclusief status, aanwezigheid, locatie en feedback.</div>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'
  +'<button class="btn ghost sm" data-act="exportPlanning">⬇ Huidige planning (Excel)</button>'
  +'<label class="btn sm" style="cursor:pointer;display:inline-flex;align-items:center;gap:6px">⬆ Nieuwe planning inlezen<input type="file" accept=".xlsx,.csv" style="display:none" data-act="importPlanning"></label>'
  +'</div>'
  +'<div class="muted" style="font-size:11px;margin-top:8px">Behoud de kolomvolgorde uit het sjabloon (Week, Datum, Maand, Fase, Ma–Vr). Een lege cel of &bdquo;n.v.t.&rdquo; betekent geen sessie. Ook .csv wordt ondersteund.</div></div>';
 return h;
}
async function addUser(){
 const name=(document.getElementById("auName").value||"").trim();
 const email=(document.getElementById("auEmail").value||"").trim().toLowerCase();
 const role=document.getElementById("auRole").value||"trainee";
 if(!email||email.indexOf("@")<1){document.getElementById("auEmail").focus();toast("Vul een geldig e-mailadres in");return;}
 if(accessUser(email)){toast("Deze gebruiker staat al in de lijst");return;}
 await Store.addAccessUser({name:name||email,email,role});
 toast("Gebruiker toegevoegd");render();
}
function findAccess(uid,email){
 return (S.access||[]).find(x=>(uid&&x.id===uid)||(email&&(x.email||"").toLowerCase()===(email||"").toLowerCase()))||null;
}
function editUser(uid,email){const u=findAccess(uid,email);if(!u)return;UI.admEdit=u.id||u.email;render();}
function cancelEditUser(){UI.admEdit=null;render();}
async function saveUser(uid,email){
 const u=findAccess(uid,email);if(!u)return;
 const nEl=document.getElementById("edName"),rEl=document.getElementById("edRole");
 const name=(nEl&&nEl.value||"").trim()||u.email;
 const role=(rEl&&rEl.value)||u.role;
 const selfDemote=me&&me.email&&(u.email||"").toLowerCase()===String(me.email).toLowerCase()&&role!=="manager";
 if(selfDemote&&!confirm("Je haalt hiermee je eigen managerrechten weg. Je verliest dan de toegang tot het tabblad Beheer.\n\nWeet je het zeker?"))return;
 await Store.updateAccessUser(u,{name,role});
 UI.admEdit=null;toast("Wijzigingen opgeslagen");
 if(selfDemote){await boot();return;}
 render();
}
async function delUser(uid,email){
 const u=findAccess(uid,email);
 if(!u)return;
 const nm=u.name||u.email;
 if(!confirm("Weet je zeker dat je "+nm+" ("+u.email+") uit de app wilt verwijderen?\n\nDeze persoon verliest direct de toegang. Voortgang en feedback blijven bewaard.")) return;
 const self=me&&me.email&&(u.email||"").toLowerCase()===String(me.email).toLowerCase();
 await Store.delAccessUser(u);
 UI.admEdit=null;toast("Gebruiker verwijderd");
 if(self){await boot();return;}
 render();
}

/* ================= Event-delegation ================= */
document.addEventListener("click",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
 switch(a){
  case "login": Auth.login(); break;
  case "logout": Auth.logout(); break;
  case "demo": if(DEMO_ALLOWED){DEMO.current=d.who; boot();} break;
  case "tab": setTab(d.tab); break;
  case "phase": UI.phase=(UI.phase===d.p?"all":d.p); render(); break;
  case "jumpNow": jumpNow(); break;
  case "openDay": openDay(+d.i,+d.day); break;
  case "openTrainee": openTrainee(d.tid); break;
  case "openTraineeDay": UI.viewTrainee=d.tid; UI.tab="trainee"; openDay(+d.i,+d.day); break;
  case "backDash": backDash(); break;
  case "closeDrawer": closeDrawer(); break;
  case "setStatus": setStatus(+d.i,+d.day,d.v); break;
  case "setAtt": setAtt(+d.i,+d.day,d.v); break;
  case "addCal": addToCalendar(+d.i,+d.day); break;
  case "syncWeek": e.stopPropagation(); syncWeek(+d.i); break;
  case "exportAll": exportIcsAll(); break;
  case "rate": setRate(+d.n); break;
  case "submitFb": submitFb(+d.i,+d.day); break;
  case "delFb": delFb(d.fid); break;
  case "exportFb": exportFeedbackCsv(UI.fbTrainee==="all"?null:S.feedback.filter(f=>f.tid===UI.fbTrainee)); break;
  case "addUser": addUser(); break;
  case "delUser": delUser(d.uid,d.uemail); break;
  case "editUser": editUser(d.uid,d.uemail); break;
  case "saveUser": saveUser(d.uid,d.uemail); break;
  case "cancelEditUser": cancelEditUser(); break;
  case "verifyAtt": verifyAtt(d.tid,+d.i,+d.day,d.v); break;
  case "submitOverall": submitOverall(d.tid); break;
  case "setLoc": setLoc(+d.i,+d.day,d.v); break;
  case "exportPlanning": exportPlanning(); break;
 }
});
document.addEventListener("change",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
 if(a==="phaseSel"){UI.phase=t.value;render();}
 else if(a==="fbTrainee"){UI.fbTrainee=t.value;render();}
 else if(a==="assignTrainer"){setAssign(+t.dataset.i,+t.dataset.day,t.value);}
 else if(a==="importPlanning"){const f=t.files&&t.files[0];if(f)importPlanning(f);t.value="";}
 else if(a==="admRole"){UI.admRole=t.value;UI.admEdit=null;render();}
});
document.addEventListener("input",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;
 if(t.dataset.act==="search"){UI.q=t.value;const staff=me.role!=="trainee";const wl=document.getElementById("wlist");if(wl)wl.innerHTML=weekListHtml(staff?(UI.viewTrainee||null):me.id, staff&&!UI.viewTrainee);}
 else if(t.dataset.act==="admSearch"){UI.admQ=t.value;UI.admEdit=null;render();const el=document.getElementById("admQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
});

/* ================= Boot ================= */
function seedInit(){
 S=clone(SEED);
 S.trainees=[];S.progress={};S.feedback=[];S.access=[];S.trainers=[];S.assign={};
 if(DEMO_ALLOWED){
   // Voorbeeldgegevens uitsluitend voor lokaal testen — nooit in productie.
   S.trainees=clone(SEED.demo.trainees||[]);
   S.progress=clone(SEED.demo.progress||{});
   S.feedback=clone(SEED.demo.feedback||[]);
 }
 delete S.demo;
}
function ensureTrainee(){
 if(me.role!=="trainee")return;
 if(!trainee(me.id))S.trainees.push({id:me.id,name:me.name,email:me.email});
 if(!S.progress[me.id])S.progress[me.id]={};
}
let _authInit=false;
async function boot(){
 if(!S)seedInit();
 if(!_authInit){await Auth.init();_authInit=true;}
 if(!Auth.signedIn()){render();return;}
 if(!DEMO_ALLOWED&&Auth.mode!=="msal"){render();return;}   // productie: nooit zonder echte aanmelding verder
 me = Auth.mode==="msal" ? (function(){const p=Auth.profile();return {id:p.email,name:p.name,email:p.email,_roles:p.roles};})() : DEMO.resolve();
 if(!me){render();return;}
 await Store.init();
 await Store.loadAccess();                    // beheerlijst (selecte groep) laden vóór de toegangscheck
 if(Auth.mode==="msal"){
   const c=classify(me.email,me._roles);
   me.role=c.role;me.allowed=c.allowed;
   if(me.allowed===false){render();return;}   // aangemeld, maar niet in de selecte groep → toegangsscherm
 }
 await Store.loadAll();
 await Store.loadAssign();
 await Store.loadPlanning();
 ensureTrainee();
 UI.tab=defaultTab();UI.viewTrainee=null;UI.open=null;UI.q="";UI.phase="all";UI.fbTrainee="all";
 render();
}
boot();
</script></body></html>
