<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Young Professional Programma — Portaal · Zig</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.10.0/lib/msal-browser.min.js"></script>
<style>
:root{
 --blue:#1F59FF;--blue-deep:#0B34D6;--blue-x:#0000D0;--cyan:#00D0FF;--navy:#1C2030;
 --bg:#EDF3F9;--surface:#FFFFFF;--surface2:#F4F8FD;
 --text:#1C2030;--dim:#5B6472;--border:#E4EBF4;
 --shadow:0 8px 30px rgba(28,32,48,.08);
 --green:#12B76A;--amber:#F79009;--red:#F04438;--grey:#98A2B3;--radius:22px;
}
@media (prefers-color-scheme: dark){
 :root{--bg:#0E1220;--surface:#161B29;--surface2:#1E2434;--text:#EAF0FA;--dim:#98A4BC;--border:#2A3247;--shadow:0 8px 30px rgba(0,0,0,.4);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Safiro","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none}
a{color:var(--blue)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 70px}
.topbar{background:linear-gradient(120deg,var(--blue) 0%,var(--blue-deep) 60%,var(--blue-x) 100%);color:#fff;border-radius:0 0 28px 28px;padding:20px 0 18px;box-shadow:0 10px 30px rgba(11,52,214,.25)}
.topbar .wrap{padding-bottom:0}
.thead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{height:36px;filter:brightness(0) invert(1);flex:0 0 auto}
.ttitle{flex:1 1 auto;min-width:200px}
.ttitle h1{font-size:20px;line-height:1.1}
.ttitle .sub{opacity:.92;font-size:12.5px;margin-top:3px;font-weight:600}
.userchip{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);padding:7px 10px 7px 7px;border-radius:16px}
.userchip .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--blue);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.userchip .un{font-weight:800;font-size:13px;line-height:1.1}
.userchip .ur{font-size:11px;opacity:.9;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.linkbtn{background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 11px;font-weight:700;font-size:12px}
.store-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.store-badge .sd{width:8px;height:8px;border-radius:50%;background:var(--cyan)}
.store-badge.local .sd{background:#FFD166}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.12);color:#fff;padding:10px 18px;border-radius:14px 14px 0 0;font-weight:700;font-size:14px;opacity:.8}
.tab.on{background:var(--bg);color:var(--blue);opacity:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700}
.btn{background:var(--blue);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;font-size:13px;transition:.15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:10px}
.btn.cyan{background:var(--cyan);color:#062a33}
.btn.block{width:100%;justify-content:center;display:flex;align-items:center;gap:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--dim)}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(130deg,var(--blue) 0%,var(--blue-deep) 55%,var(--blue-x) 100%)}
.loginbox{background:var(--surface);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.3);width:min(440px,100%);padding:30px 28px;text-align:center}
.loginbox .lg{height:40px;margin-bottom:16px}
.loginbox h1{font-size:22px}
.loginbox p{color:var(--dim);font-size:13px;margin:6px 0 20px}
.msbtn{background:#2F2F2F;color:#fff;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px}
.demo-sep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:20px 0 14px}
.demo-sep::before,.demo-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.demorow{display:flex;flex-direction:column;gap:8px;text-align:start}
.demobtn{display:flex;align-items:center;gap:11px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 13px;color:var(--text);font-weight:700;font-size:13px;transition:.14s}
.demobtn:hover{border-color:var(--blue);transform:translateY(-1px)}
.demobtn .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;flex:0 0 auto}
.demobtn small{display:block;font-weight:600;color:var(--dim);font-size:11px}
/* planning */
.phaserow{display:flex;gap:10px;overflow-x:auto;padding:16px 0 6px}
.phase{flex:0 0 auto;min-width:150px;max-width:220px;border-radius:16px;padding:12px 14px;color:#fff;cursor:pointer;transition:.15s;border:0}
.phase:hover{transform:translateY(-2px)}
.phase .ph{font-size:11px;font-weight:800;opacity:.9;text-transform:uppercase;letter-spacing:.04em}
.phase .pt{font-size:13px;font-weight:700;margin-top:3px;line-height:1.25}
.phase .pw{font-size:11px;opacity:.85;margin-top:6px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.filters .grow{flex:1 1 200px}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;cursor:pointer}
.chk input{width:auto}
.week{margin-bottom:14px;overflow:hidden}
.week.now{outline:2px solid var(--blue);outline-offset:0}
.whead{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border)}
.wstripe{width:8px;align-self:stretch;border-radius:8px;min-height:34px}
.wtitle{font-weight:800;font-size:15px}
.wsub{font-size:12px;color:var(--dim);font-weight:600}
.nowbadge{background:var(--blue);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border)}
.day{background:var(--surface);padding:11px 12px;min-height:108px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:5px;border:0;text-align:start;font:inherit;color:inherit;width:100%}
.day:hover{background:var(--surface2)}
.day.na{opacity:.5;cursor:default}
.day.na:hover{background:var(--surface)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dname{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.ddate{font-size:10px;color:var(--dim);font-weight:600}
.dtitle{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dfoot{margin-top:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.mini{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;display:inline-flex;gap:3px;align-items:center}
.mini.fb{background:rgba(31,89,255,.12);color:var(--blue)}
.mini.cal{background:rgba(0,208,255,.16);color:#0a7c93}
.mini.att{background:rgba(18,183,106,.14);color:#0a7a48}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(500px,94vw);background:var(--bg);box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.dhead{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 20px}
.dbody{padding:18px 20px;overflow-y:auto;flex:1}
.x{background:var(--surface2);border:1px solid var(--border);border-radius:10px;width:34px;height:34px;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.segb{padding:7px 12px;border-radius:10px;font-weight:700;font-size:12px;background:var(--surface);border:1px solid var(--border);color:var(--text)}
.fbitem{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.fbtop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stars{color:var(--amber);font-size:13px;letter-spacing:1px}
.rate span{cursor:pointer}
.sect{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:18px 0 8px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.kpi{padding:16px 18px}
.kpi .n{font-size:28px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--dim);font-weight:700;margin-top:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tcard{padding:16px 18px;cursor:pointer;transition:.14s}
.tcard:hover{transform:translateY(-2px);border-color:var(--blue)}
.tcard .th{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.tcard .big{width:44px;height:44px;font-size:16px}
.progrow{display:flex;align-items:center;gap:12px;margin:9px 0}
.progrow .pl{width:210px;font-size:12.5px;font-weight:700;flex:0 0 auto}
.bar{flex:1;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px}
.tstat{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.tstat div{font-size:12px}
.tstat b{font-size:16px;display:block}
.sh{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--border)}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px}
.tag.mgr{background:rgba(31,89,255,.14);color:var(--blue)}
.tag.stk{background:rgba(0,208,255,.16);color:#0a7c93}
.tag.tr{background:rgba(18,183,106,.14);color:#0a7a48}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{background:var(--surface2);border:1px dashed var(--border);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--dim);margin:14px 0}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 13px;font-weight:700;font-size:13px;color:var(--text);margin:16px 0 4px}
.itsetup{margin-top:20px;text-align:start;background:var(--surface2);border:1px solid var(--border);border-radius:14px}
.itsetup summary{cursor:pointer;font-weight:800;font-size:12.5px;padding:12px 14px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:7px}
.itsetup summary::-webkit-details-marker{display:none}
.itsetup summary::before{content:"⚙";font-size:14px}
.itsetup[open] summary{border-bottom:1px solid var(--border)}
.itsetup ol{margin:12px 0;padding-inline-start:24px}
.itsetup li{font-size:12px;line-height:1.55;margin-bottom:9px;color:var(--text)}
.itsetup code{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:1px 5px;font-size:11px;word-break:break-all}
.itsetup .free{margin:0 14px 12px;font-size:11px;color:var(--green);font-weight:700;background:rgba(18,183,106,.1);border-radius:9px;padding:8px 10px}
/* ================= Responsief: tablets & telefoons ================= */
@media(max-width:1024px){
 .wrap{padding:0 16px 64px}
 .progrow .pl{width:170px}
 .phaserow{-webkit-overflow-scrolling:touch}
}
@media(max-width:720px){
 .wrap{padding:0 14px 60px}
 .topbar{padding:16px 0 14px;border-radius:0 0 22px 22px}
 .thead{gap:12px}
 .logo{height:30px}
 .ttitle{min-width:140px}
 .ttitle h1{font-size:18px}
 .tabs{gap:5px;margin-top:14px}
 .tab{padding:9px 14px;font-size:13px}
 .days{grid-template-columns:repeat(2,1fr)}
 .day{min-height:96px}
 .progrow{gap:9px}
 .progrow .pl{width:120px;font-size:12px}
 .kpi .n{font-size:24px}
 .drawer{width:min(560px,96vw)}
 .dhead,.dbody{padding-left:16px;padding-right:16px}
 .loginbox{padding:26px 18px}
 /* Voorkomt dat iOS/Safari inzoomt zodra je een invoerveld aantikt */
 input,select,textarea{font-size:16px}
}
@media(max-width:460px){
 .wrap{padding:0 12px 56px}
 .thead{gap:10px}
 .userchip{padding:6px 9px 6px 6px}
 .userchip .un{font-size:12px}
 .tab{padding:8px 12px;font-size:12.5px}
 .day{min-height:88px;padding:9px 10px}
 .dtitle{-webkit-line-clamp:4}
 .drawer{width:100vw}
 .kpis{gap:10px}
 .filters{gap:8px}
 .btn.sm{padding:7px 12px}
}
</style></head><body>
<div id="app"></div>
<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<div class="drawer" id="drawer"><div id="drawerInner"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================================================================
   Young Professional Programma — Portaal · Zig
   Web-app met Microsoft-SSO (MSAL) en rol-gebaseerde weergave.
   - Trainee: eigen planning, status/aanwezigheid, feedback, Outlook.
   - Manager: dashboard met voortgang per trainee + feedback per sessie.
   Draait standaard in DEMO-modus (voorbeeldprofielen). Zodra IT de
   Entra client-ID invult, logt iedereen in via echte Microsoft-SSO tegen
   de Zig-tenant (Zig AD) en werkt de app met Microsoft Graph (agenda +
   SharePoint-opslag). Toegang is beperkt tot een geselecteerde groep.
   Alles valt binnen de bestaande Microsoft 365-licenties — geen extra kosten.
   ================================================================ */

const CONFIG = {
  auth: {
    enabled: true,                  // SSO staat klaar; wordt actief zodra clientId is ingevuld
    clientId: "405eb1a6-e0db-43ec-8f17-a3fabadeaa97",                   // <<< IT vult hier de Application (client) ID in uit de Entra app-registratie.
                                    //     Kan ook zonder de code te wijzigen via de URL:
                                    //     ...YP-Portaal.html?clientId=<GUID>
    tenantId: "zig.nl"              // Zig-tenant (mag ook de Directory/tenant-ID GUID zijn)
  },
  graph: { scopes: ["User.Read","Calendars.ReadWrite","Sites.ReadWrite.All"] },
  sharepoint: {                     // gedeelde opslag via Microsoft Graph — site: Zig|Academy
    siteHost: "zigsoftware.sharepoint.com",
    sitePath: "/teams/Academy",
    progressList: "YP_Progress",
    feedbackList: "YP_Feedback"
  },
  // --- Toegang beperken tot een selecte groep managers en medewerkers ---
  // Kosteloos: app-registratie en SSO vallen onder Microsoft Entra ID Free
  // (inbegrepen in de M365-licenties die Zig al heeft). Twee lagen, combineerbaar:
  //  1) HARDE grens in Entra: op de bedrijfstoepassing 'Toewijzing vereist = Ja'
  //     zetten en de gekozen personen toewijzen (aanbevolen).
  //  2) In-app vangnet: 'allowlist' hieronder vullen met e-mailadressen. Blijft de
  //     lijst leeg, dan vertrouwt de app op de Entra-toewijzing.
  access: {
    restrict: true,                 // true = alleen toegestane personen/rollen komen binnen
    allowedRoles: ["Manager","Trainee"],   // Entra app-rollen die toegang geven (indien in gebruik)
    allowlist: [                    // optioneel: e-mails met toegang (naast Entra-toewijzing)
      // "voornaam.achternaam@zig.nl",
    ],
    contact: "jarno.cislo@zig.nl"   // waar de knop 'Toegang aanvragen' heen mailt
  },
  managers: [                       // e-mails met managerrol (naast Entra app-rol "Manager")
    "jarno.cislo@zig.nl","andrew.delahaije@zig.nl","leonie.ginus-dejong@zig.nl"
  ],
  tz: "W. Europe Standard Time"
};

/* Laat IT de app configureren zonder de code te wijzigen, bv. voor een pilot:
   ...YP-Portaal.html?clientId=<GUID>&tenantId=<zig.nl of GUID>
   De waarde wordt in deze browser onthouden. Een client-ID is openbaar/niet-geheim. */
(function(){try{
  const qs=new URLSearchParams(location.search);
  if(qs.get("clientId"))localStorage.setItem("yp_clientId",qs.get("clientId"));
  if(qs.get("tenantId"))localStorage.setItem("yp_tenantId",qs.get("tenantId"));
  const cid=qs.get("clientId")||localStorage.getItem("yp_clientId");
  const tid=qs.get("tenantId")||localStorage.getItem("yp_tenantId");
  if(cid)CONFIG.auth.clientId=cid;

/* ================= Helpers ================= */
function clone(o){return JSON.parse(JSON.stringify(o));}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function initials(n){return (n||"?").replace(/\(demo\)/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();}
function firstLine(t){return (t||"").split("\n")[0];}
function colorFor(str){let h=0;for(let i=0;i<(str||"").length;i++)h=(h*31+str.charCodeAt(i))%360;return "hsl("+h+",62%,52%)";}
function sessDate(i,day){const b=new Date((S.cohortStart||"2025-09-01")+"T00:00:00");b.setDate(b.getDate()+i*7+day);return b;}
function fmt(d){return d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});}
function fmtShort(d){return d.toLocaleDateString("nl-NL",{day:"numeric",month:"short"});}
function todayW(){const b=new Date((S.cohortStart||"2025-09-01")+"T00:00:00");const t=new Date();t.setHours(0,0,0,0);const d=Math.floor((t-b)/(7*864e5));return (d>=0&&d<52)?d:-1;}
function stars(n){n=n||0;return "★".repeat(n)+"☆".repeat(5-n);}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2600);}
function isNa(i,day){return !!S.weeks[i].s[day].na;}
function prog(tid,i,day){const m=(S.progress[tid]||{});return m[i+"_"+day]||{st:"planned",att:null,cs:false};}
function setProg(tid,i,day,patch){if(!S.progress[tid])S.progress[tid]={};const k=i+"_"+day;const cur=S.progress[tid][k]||{st:"planned",att:null,cs:false};S.progress[tid][k]=Object.assign(cur,patch);}
function fbFor(tid,i,day){return (S.feedback||[]).filter(f=>f.tid===tid&&f.wi===i&&f.day===day);}
function fbSession(i,day){return (S.feedback||[]).filter(f=>f.wi===i&&f.day===day);}
function trainee(tid){return (S.trainees||[]).find(t=>t.id===tid);}

function stats(tid){
 let total=0,done=0,tracked=0,present=0;
 for(let i=0;i<S.weeks.length;i++)for(let day=0;day<5;day++){
   if(isNa(i,day))continue;total++;const p=prog(tid,i,day);
   if(p.st==="done")done++;if(p.att){tracked++;if(p.att==="present")present++;}
 }
 const fb=(S.feedback||[]).filter(f=>f.tid===tid);
 const rated=fb.filter(f=>f.rt);const avg=rated.length?(rated.reduce((a,f)=>a+f.rt,0)/rated.length):0;
 return {total,done,pct:total?Math.round(done/total*100):0,attPct:tracked?Math.round(present/tracked*100):null,fb:fb.length,avg};
}

 async logout(){if(this.mode==="msal"){try{await this.pca.logoutRedirect();}catch(e){}}else{DEMO.current=null;boot();}},
 async token(){if(this.mode!=="msal")return null;try{const r=await this.pca.acquireTokenSilent({account:this.account,scopes:CONFIG.graph.scopes});return r.accessToken;}catch(e){try{const r=await this.pca.acquireTokenPopup({scopes:CONFIG.graph.scopes});return r.accessToken;}catch(e2){return null;}}},
 profile(){if(this.mode==="msal"&&this.account){const c=this.account.idTokenClaims||{};return {id:(this.account.username||this.account.homeAccountId||"").toLowerCase(),name:this.account.name||this.account.username,email:(this.account.username||"").toLowerCase(),roles:c.roles||[]};}return null;}
};
function roleFor(email,roles){
 if(roles&&roles.map(r=>String(r).toLowerCase()).indexOf("manager")>=0)return "manager";
 if(CONFIG.managers.map(m=>m.toLowerCase()).indexOf((email||"").toLowerCase())>=0)return "manager";
 return "trainee";
}
/* Bepaalt of een aangemelde gebruiker toegang heeft (selecte groep) en met welke rol. */
function classify(email,roles){
 const role=roleFor(email,roles);                 // "manager" of "trainee"
 const A=CONFIG.access||{};
 if(!A.restrict)return {allowed:true,role};        // restrictie uit → iedereen die inlogt mag erin
 const em=(email||"").toLowerCase();
 const rl=(roles||[]).map(r=>String(r).toLowerCase());
 const list=(A.allowlist||[]).map(x=>x.toLowerCase());
 const roleOk=(A.allowedRoles||[]).some(r=>rl.indexOf(String(r).toLowerCase())>=0);
 const isMgr=role==="manager";
 // In-app lijst ingevuld → streng handhaven. Lijst leeg → vertrouw op de Entra-toewijzing.
 const allowed = list.length ? (isMgr||list.indexOf(em)>=0||roleOk) : true;
 return {allowed,role};
}

 },

 async _site(tok){const j=await fetch("https://graph.microsoft.com/v1.0/sites/"+CONFIG.sharepoint.siteHost+":"+CONFIG.sharepoint.sitePath,{headers:{Authorization:"Bearer "+tok}}).then(r=>r.json());this.siteId=j.id;},
 async loadAll(){
   // begin met lokale/seed-data

   if(local){S.trainees=local.trainees||S.trainees;S.progress=local.progress||S.progress;S.feedback=local.feedback||S.feedback;if(local.cohortName)S.cohortName=local.cohortName;if(local.cohortStart)S.cohortStart=local.cohortStart;}
   if(this.mode!=="graph")return;
   try{
     const fb=await this._g("/sites/"+this.siteId+"/lists/"+CONFIG.sharepoint.feedbackList+"/items?expand=fields&$top=2000");
     S.feedback=(fb.value||[]).map(it=>({id:"sp"+it.id,spId:it.id,tid:it.fields.TraineeId,wi:+it.fields.Wi,day:+it.fields.Day,a:it.fields.AuthorName,r:it.fields.RoleName||"Deelnemer",dt:(it.fields.Created||"").slice(0,10),rt:+it.fields.Rating||0,c:it.fields.Comment||""}));
     const pr=await this._g("/sites/"+this.siteId+"/lists/"+CONFIG.sharepoint.progressList+"/items?expand=fields&$top=5000");
     const pm={};(pr.value||[]).forEach(it=>{const f=it.fields;if(!pm[f.TraineeId])pm[f.TraineeId]={};pm[f.TraineeId][f.Wi+"_"+f.Day]={st:f.Status||"planned",att:f.Attendance||null,cs:!!f.Synced,spId:it.id};});
     S.progress=pm;
     // trainees afleiden uit progress/feedback
     const seen={};(S.trainees||[]).forEach(t=>seen[t.id]=t);
     Object.keys(pm).forEach(id=>{if(!seen[id])seen[id]={id,name:id,email:id};});
     S.feedback.forEach(f=>{if(f.tid&&!seen[f.tid])seen[f.tid]={id:f.tid,name:f.a||f.tid,email:f.tid};});
     S.trainees=Object.keys(seen).map(k=>seen[k]);
   }catch(e){this.mode="local";}
 },
 async saveProgress(tid,i,day,val){
   setProg(tid,i,day,val);
   if(this.mode==="graph"){
     try{const t=trainee(tid)||me;const p=S.progress[tid][i+"_"+day];const fields={Title:"YP",TraineeId:tid,TraineeName:t&&t.name||tid,Wi:i,Day:day,Status:p.st,Attendance:p.att||"",Synced:!!p.cs};
       if(p.spId){await this._g("/sites/"+this.siteId+"/lists/"+CONFIG.sharepoint.progressList+"/items/"+p.spId+"/fields",{method:"PATCH",body:JSON.stringify(fields)});}
       else{const r=await this._g("/sites/"+this.siteId+"/lists/"+CONFIG.sharepoint.progressList+"/items",{method:"POST",body:JSON.stringify({fields})});if(r&&r.id)p.spId=r.id;}
       return;
     }catch(e){}
   }
   this.saveLocal();
 },
 async addFeedback(fb){
   if(this.mode==="graph"){
     try{const t=trainee(fb.tid);const fields={Title:"YP feedback",TraineeId:fb.tid,TraineeName:t&&t.name||fb.tid,Wi:fb.wi,Day:fb.day,AuthorName:fb.a,RoleName:fb.r,Rating:fb.rt||0,Comment:fb.c};

};

/* ================= Outlook / agenda ================= */
function isoLocal(d,h,m){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(h)+":"+p(m)+":00";}
function icsStamp(d,h,m){const p=n=>String(n).padStart(2,"0");return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(h)+p(m)+"00";}
function buildVevent(i,day){
 const w=S.weeks[i],se=w.s[day],ph=S.phases[w.p]||{};const d=sessDate(i,day);
 const title=(firstLine(se.t)||"Sessie").slice(0,150);
 const desc=("Young Professional programma — "+w.w+" ("+w.d+")\\nFase: "+(ph.head||"")+" — "+(ph.title||"")+"\\n\\n"+se.t).replace(/\n/g,"\\n").replace(/,/g,"\\,");
 return ["BEGIN:VEVENT","UID:yp-"+i+"-"+day+"@zig.nl","DTSTAMP:"+icsStamp(new Date(),9,0),"DTSTART:"+icsStamp(d,9,0),"DTEND:"+icsStamp(d,17,0),"SUMMARY:YP: "+title.replace(/,/g,"\\,"),"DESCRIPTION:"+desc,"LOCATION:Zig","BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Herinnering — YP-sessie morgen","END:VALARM","BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:YP-sessie begint zo","END:VALARM","END:VEVENT"].join("\r\n");
}
function downloadIcs(name,events){const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Zig//YP Planning//NL","CALSCALE:GREGORIAN","METHOD:PUBLISH",...events,"END:VCALENDAR"].join("\r\n");const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function outlookWeb(i,day){const w=S.weeks[i],se=w.s[day],ph=S.phases[w.p]||{};const d=sessDate(i,day);const p=n=>String(n).padStart(2,"0");const iso=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());const subject="YP: "+(firstLine(se.t)||"Sessie").slice(0,150);const body="Young Professional programma — "+w.w+" ("+w.d+")\nFase: "+(ph.head||"")+" — "+(ph.title||"")+"\n\n"+se.t;const url="https://outlook.office.com/calendar/0/deeplink/compose?subject="+encodeURIComponent(subject)+"&startdt="+iso+"T09:00:00&enddt="+iso+"T17:00:00&location=Zig&body="+encodeURIComponent(body);window.open(url,"_blank","noopener");}
async function addToCalendar(i,day){
 const tok=await Auth.token();
 const w=S.weeks[i],se=w.s[day],ph=S.phases[w.p]||{};const d=sessDate(i,day);
 if(tok){
   try{
     const body={subject:"YP: "+firstLine(se.t).slice(0,150),body:{contentType:"HTML",content:esc(w.w)+" ("+esc(w.d)+")<br>Fase: "+esc(ph.head)+" — "+esc(ph.title)+"<br><br>"+esc(se.t).replace(/\n/g,"<br>")},start:{dateTime:isoLocal(d,9,0),timeZone:CONFIG.tz},end:{dateTime:isoLocal(d,17,0),timeZone:CONFIG.tz},location:{displayName:"Zig"},isReminderOn:true,reminderMinutesBeforeStart:30};
     const r=await fetch("https://graph.microsoft.com/v1.0/me/events",{method:"POST",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify(body)});
     if(r.ok){await Store.saveProgress(me.id,i,day,{cs:true});toast("Toegevoegd aan je Outlook-agenda");render();return;}
   }catch(e){}
 }

function weekListHtml(tid,mgrTemplate){
 const tw=todayW();const ws=(S.weeks||[]).filter(weekMatch);
 if(!ws.length)return '<div class="empty">Geen weken met deze filters.</div>';
 return ws.map(w=>{const p=S.phases[w.p]||{color:"var(--blue)"};const now=w.i===tw;
  const days=w.s.map((se,day)=>{const na=se.na;const t=firstLine(se.t);
   let dot="",fbBadge="",calBadge="",attBadge="";
   if(!na){
    if(tid){const pr=prog(tid,w.i,day);const stc=STATUS[pr.st]||STATUS.planned;dot='<span class="dot" style="background:'+stc.c+'" title="'+stc.l+'"></span>';if(pr.cs)calBadge='<span class="mini cal">📅</span>';if(pr.att&&ATT[pr.att])attBadge='<span class="mini att">✓ '+ATT[pr.att].l+'</span>';const fn=fbFor(tid,w.i,day).length;if(fn)fbBadge='<span class="mini fb">💬 '+fn+'</span>';}
    else{const fn=fbSession(w.i,day).length;if(fn)fbBadge='<span class="mini fb">💬 '+fn+'</span>';dot='<span class="dot" style="background:'+p.color+'"></span>';}
   }
   return '<button class="day '+(na?"na":"")+'" '+(na?"disabled":'data-act="openDay" data-i="'+w.i+'" data-day="'+day+'"')+'><div class="dtop"><span class="dname">'+DSHORT[day]+'</span><span class="ddate">'+fmtShort(sessDate(w.i,day))+'</span></div><div class="dtitle">'+(na?'<span class="muted">n.v.t.</span>':esc(t))+'</div><div class="dfoot">'+dot+fbBadge+calBadge+attBadge+'</div></button>';
  }).join("");
  const syncBtn=tid?'<button class="btn ghost sm" style="margin-inline-start:10px" data-act="syncWeek" data-i="'+w.i+'">📅 Sync week</button>':"";
  return '<div class="card week '+(now?"now":"")+'" id="wk'+w.i+'"><div class="whead"><div class="wstripe" style="background:'+p.color+'"></div><div style="flex:1"><div class="wtitle">'+esc(w.w)+' <span class="wsub">· '+esc(w.d)+'</span></div><div class="wsub">'+esc(p.head)+' — '+esc(p.title)+'</div></div>'+(now?'<span class="nowbadge">DEZE WEEK</span>':"")+syncBtn+'</div><div class="days">'+days+'</div></div>';
 }).join("");
}

/* ---------- Drawer ---------- */
function viewDrawer(){
 const {i,day}=UI.open;const w=S.weeks[i];const se=w.s[day];const p=S.phases[w.p]||{};const d=sessDate(i,day);
 let h='<div class="dhead"><div style="display:flex;align-items:flex-start;gap:12px"><div style="flex:1"><div class="wsub" style="color:'+(p.color||"var(--blue)")+'">'+esc(p.head)+' — '+esc(p.title)+'</div><h2 style="font-size:18px;margin-top:3px">'+esc(w.w)+' · '+DAYS[day]+'</h2><div class="wsub">'+fmt(d)+' · 09:00–17:00</div></div><button class="x" data-act="closeDrawer">×</button></div></div><div class="dbody">';
 h+='<div class="sect">Activiteit</div><div class="card" style="padding:12px 14px;white-space:pre-wrap;font-weight:600">'+esc(se.t)+'</div>';

 if(me.role==="manager" && !UI.viewTrainee){
   // Manager op template-planning -> toon alle trainees + feedback voor deze sessie
   h+='<div class="sect">Voortgang trainees</div>';
   (S.trainees||[]).forEach(t=>{const pr=prog(t.id,i,day);const stc=STATUS[pr.st]||STATUS.planned;const at=pr.att&&ATT[pr.att];h+='<div class="sh" style="border:1px solid var(--border);border-radius:12px;margin-bottom:8px;padding:9px 12px"><div class="avatar" style="background:'+colorFor(t.name)+'">'+initials(t.name)+'</div><div style="flex:1"><div style="font-weight:700">'+esc(t.name.replace(/\s*\(demo\)/i,""))+'</div></div><span class="pill" style="background:var(--surface2);color:'+stc.c+'">'+stc.l+'</span>'+(at?'<span class="pill" style="background:var(--surface2);color:'+at.c+';margin-inline-start:6px">'+at.l+'</span>':"")+'</div>';});
   const fbs=fbSession(i,day);
   h+='<div class="sect">Feedback deze sessie ('+fbs.length+')</div>';
   if(!fbs.length)h+='<div class="muted" style="font-size:13px">Nog geen feedback voor deze sessie.</div>';
   fbs.slice().reverse().forEach(f=>{const t=trainee(f.tid);h+=fbCard(f,t,true);});
 }else{
   const tid=me.role==="manager"?UI.viewTrainee:me.id;
   const pr=prog(tid,i,day);
   const canEdit=(me.role==="trainee")||(me.role==="manager"); // manager mag namens trainee bijwerken
   if(canEdit){
     h+='<div class="sect">Status</div><div class="seg">'+["planned","done","cancelled"].map(s=>{const on=pr.st===s;return '<button class="segb" style="'+(on?"color:#fff;background:"+STATUS[s].c+";border-color:"+STATUS[s].c:"")+'" data-act="setStatus" data-i="'+i+'" data-day="'+day+'" data-v="'+s+'">'+STATUS[s].l+'</button>';}).join("")+'</div>';
     h+='<div class="sect">Aanwezigheid</div><div class="seg">'+Object.keys(ATT).map(s=>{const on=pr.att===s;return '<button class="segb" style="'+(on?"color:#fff;background:"+ATT[s].c+";border-color:"+ATT[s].c:"")+'" data-act="setAtt" data-i="'+i+'" data-day="'+day+'" data-v="'+s+'">'+ATT[s].l+'</button>';}).join("")+'</div>';
   }
   if(me.role==="trainee"){
     h+='<div class="sect">Outlook-agenda</div>';
     if(pr.cs)h+='<div class="pill" style="background:rgba(0,208,255,.16);color:#0a7c93">📅 In je agenda gezet</div><div style="margin-top:8px"><button class="btn cyan sm" data-act="addCal" data-i="'+i+'" data-day="'+day+'">Opnieuw toevoegen</button></div>';
     else h+='<button class="btn cyan" data-act="addCal" data-i="'+i+'" data-day="'+day+'">📅 Toevoegen aan mijn agenda</button><div class="muted" style="font-size:12px;margin-top:6px">Zet deze sessie (09:00–17:00, met herinnering) in je Outlook-agenda.</div>';
   }
   const fbs=fbFor(tid,i,day);
   h+='<div class="sect">Feedback ('+fbs.length+')</div>';
   if(!fbs.length)h+='<div class="muted" style="font-size:13px;margin-bottom:8px">Nog geen feedback voor deze sessie.</div>';
   fbs.slice().reverse().forEach(f=>{h+=fbCard(f,null,me.role==="manager");});
   h+=fbForm(i,day);
 }
 h+='</div>';return h;
}
function fbCard(f,t,canDel){
 return '<div class="fbitem"><div class="fbtop"><div class="avatar" style="background:'+(f.r==="Manager"?"var(--blue)":colorFor(f.a))+'">'+initials(f.a)+'</div><div style="flex:1"><div style="font-weight:800;font-size:13px">'+esc(f.a)+' <span class="muted" style="font-weight:600">· '+esc(f.r)+'</span></div>'+(t?'<div class="muted" style="font-size:11px">'+esc(t.name.replace(/\s*\(demo\)/i,""))+' · '+esc(f.dt)+'</div>':'<div class="muted" style="font-size:11px">'+esc(f.dt)+'</div>')+'</div>'+(f.rt?'<div class="stars" title="'+f.rt+'/5">'+stars(f.rt)+'</div>':"")+'</div><div style="font-size:13px;white-space:pre-wrap">'+esc(f.c)+'</div>'+(canDel?'<div style="text-align:end;margin-top:6px"><button class="btn ghost sm" data-act="delFb" data-fid="'+f.id+'">Verwijderen</button></div>':"")+'</div>';
}
function fbForm(i,day){
 return '<div class="card" style="padding:14px;margin-top:10px"><div style="font-weight:800;margin-bottom:8px">Feedback toevoegen</div><input id="fbName" placeholder="Naam" value="'+esc(me.name)+'" style="margin-bottom:8px"><div id="rateBox" class="rate" style="font-size:22px;color:var(--amber);margin-bottom:8px">'+[1,2,3,4,5].map(n=>'<span data-act="rate" data-n="'+n+'">'+(n<=UI.curRate?"★":"☆")+'</span>').join("")+'</div><textarea id="fbText" rows="3" placeholder="Jouw feedback op deze sessie…"></textarea><div style="margin-top:8px"><button class="btn" data-act="submitFb" data-i="'+i+'" data-day="'+day+'">Feedback plaatsen</button></div></div>';
}

/* ---------- Manager: dashboard ---------- */
function viewDashboard(){
 const ts=S.trainees||[];
 let totPct=0,totAtt=0,attN=0,fbTot=0,rSum=0,rN=0;
 const cards=ts.map(t=>{const s=stats(t.id);totPct+=s.pct;if(s.attPct!=null){totAtt+=s.attPct;attN++;}fbTot+=s.fb;const fb=(S.feedback||[]).filter(f=>f.tid===t.id&&f.rt);fb.forEach(f=>{rSum+=f.rt;rN++;});return {t,s};});
 const avgPct=ts.length?Math.round(totPct/ts.length):0;
 const avgAtt=attN?Math.round(totAtt/attN):null;
 const avgR=rN?(rSum/rN).toFixed(1):"–";
 let h='<div class="kpis">'+kpi(ts.length,"Trainees")+kpi(avgPct+"%","Gem. voortgang","var(--blue)")+kpi(avgAtt==null?"–":avgAtt+"%","Gem. aanwezigheid","var(--green)")+kpi(fbTot,"Feedback-items","var(--cyan)")+kpi(avgR+(rN?" ★":""),"Gem. beoordeling","var(--amber)")+'</div>';
 h+='<h3 style="font-size:15px;margin:6px 0 10px">Voortgang per trainee</h3>';
 h+='<div class="tgrid">'+cards.map(({t,s})=>{const col=colorFor(t.name);return '<div class="card tcard" data-act="openTrainee" data-tid="'+t.id+'"><div class="th"><div class="avatar big" style="background:'+col+'">'+initials(t.name)+'</div><div><div style="font-weight:800;font-size:15px">'+esc(t.name.replace(/\s*\(demo\)/i,""))+'</div><div class="muted" style="font-size:12px">'+esc(t.email)+'</div></div></div><div class="progrow" style="margin:0"><div class="bar"><i style="width:'+s.pct+'%;background:'+col+'"></i></div><div style="width:44px;text-align:end;font-weight:800;font-size:13px">'+s.pct+'%</div></div><div class="tstat"><div><b>'+s.done+'/'+s.total+'</b>Afgerond</div><div><b>'+(s.attPct==null?"–":s.attPct+"%")+'</b>Aanwezig</div><div><b>'+(s.avg?s.avg.toFixed(1)+" ★":"–")+'</b>Beoordeling</div><div><b>'+s.fb+'</b>Feedback</div></div></div>';}).join("")+'</div>';
 // voortgang per fase (aggregaat)
 h+='<div class="card" style="padding:18px;margin-top:18px"><h3 style="font-size:15px;margin-bottom:12px">Voortgang per fase (alle trainees)</h3>';
 (S.phases||[]).forEach(p=>{let tot=0,done=0;S.weeks.filter(w=>w.p===p.id).forEach(w=>w.s.forEach((se,day)=>{if(se.na)return;ts.forEach(t=>{tot++;if(prog(t.id,w.i,day).st==="done")done++;});}));const pct=tot?Math.round(done/tot*100):0;h+='<div class="progrow"><div class="pl">'+esc(p.head)+' · '+esc(p.title)+'</div><div class="bar"><i style="width:'+pct+'%;background:'+p.color+'"></i></div><div style="width:56px;text-align:end;font-weight:700;font-size:12px">'+pct+'%</div></div>';});
 h+='</div>';
 return h;
}
/* ---------- Manager: feedback per sessie ---------- */
function viewMgrFeedback(){
 const ts=S.trainees||[];
 let items=(S.feedback||[]).slice().sort((a,b)=>(b.dt||"").localeCompare(a.dt||"")||b.wi-a.wi);
 if(UI.fbTrainee!=="all")items=items.filter(f=>f.tid===UI.fbTrainee);
 let h='<div class="card" style="padding:16px 18px;margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1"><h2 style="font-size:18px">Feedback per sessie</h2><div class="muted" style="margin-top:3px">Alle feedback van trainees, zichtbaar voor managers en stakeholders. Totaal: '+items.length+'</div></div>'
  +'<select style="width:auto" data-act="fbTrainee"><option value="all">Alle trainees</option>'+ts.map(t=>'<option value="'+t.id+'"'+(UI.fbTrainee===t.id?" selected":"")+'>'+esc(t.name.replace(/\s*\(demo\)/i,""))+'</option>').join("")+'</select>'
  +(items.length?'<button class="btn ghost sm" data-act="exportFb">Exporteer (.csv)</button>':"")+'</div>';
 if(!items.length)return h+'<div class="empty">Nog geen feedback.</div>';
 h+='<div style="margin-top:14px">'+items.map(f=>{const w=S.weeks[f.wi];const t=trainee(f.tid);const d=sessDate(f.wi,f.day);return '<div class="card" style="padding:14px 16px;margin-bottom:10px"><div style="display:flex;gap:12px;align-items:flex-start"><div class="avatar" style="width:38px;height:38px;font-size:14px;background:'+colorFor(t?t.name:f.a)+'">'+initials(t?t.name:f.a)+'</div><div style="flex:1"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-weight:800">'+esc(t?t.name.replace(/\s*\(demo\)/i,""):f.a)+'</span><span class="tag tr">Trainee</span>'+(f.rt?'<span class="stars">'+stars(f.rt)+'</span>':"")+'<span class="muted" style="font-size:12px;margin-inline-start:auto">'+esc(f.dt)+'</span></div><div class="muted" style="font-size:12px;margin:3px 0 7px">'+esc(w?w.w:"")+' · '+DAYS[f.day]+' · '+fmtShort(d)+' — '+esc(firstLine(w?w.s[f.day].t:""))+'</div><div style="font-size:13.5px;white-space:pre-wrap">'+esc(f.c)+'</div></div><button class="btn ghost sm" data-act="openTraineeDay" data-tid="'+f.tid+'" data-i="'+f.wi+'" data-day="'+f.day+'">Open</button></div></div>';}).join("")+'</div>';
 return h;
}
/* ---------- Manager: trainee-detail ---------- */
function viewTraineeDetail(tid){
 const t=trainee(tid);if(!t)return '<div class="empty">Trainee niet gevonden.</div>';
 const s=stats(tid);const col=colorFor(t.name);
 let h='<button class="backbtn" data-act="backDash">← Terug naar dashboard</button>';
 h+='<div class="card" style="padding:18px;margin-top:6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="avatar big" style="background:'+col+';width:52px;height:52px;font-size:18px">'+initials(t.name)+'</div><div style="flex:1"><h2 style="font-size:19px">'+esc(t.name.replace(/\s*\(demo\)/i,""))+'</h2><div class="muted" style="font-size:12px">'+esc(t.email)+'</div></div></div>';
 h+='<div class="kpis">'+kpi(s.pct+"%","Voortgang","var(--blue)")+kpi(s.done+"/"+s.total,"Sessies afgerond","var(--green)")+kpi(s.attPct==null?"–":s.attPct+"%","Aanwezigheid","var(--green)")+kpi(s.fb,"Feedback-items","var(--cyan)")+kpi(s.avg?s.avg.toFixed(1)+" ★":"–","Gem. beoordeling","var(--amber)")+'</div>';
 h+='<h3 style="font-size:15px;margin:6px 0 8px">Planning &amp; status van '+esc(t.name.replace(/\s*\(demo\)/i,""))+'</h3>';
 h+='<div class="hint">Klik op een dag om status/aanwezigheid bij te werken of feedback te bekijken.</div>';
 h+=weekListHtml(tid,false);
 return h;
}
/* ---------- Trainee: mijn feedback ---------- */
function viewMyFeedback(){
 let items=(S.feedback||[]).filter(f=>f.tid===me.id).sort((a,b)=>(b.dt||"").localeCompare(a.dt||"")||b.wi-a.wi);
 let h='<div class="card" style="padding:16px 18px;margin-top:18px"><h2 style="font-size:18px">Mijn feedback</h2><div class="muted" style="margin-top:3px">Jouw feedback per sessie — zichtbaar voor je manager en stakeholders. Totaal: '+items.length+'</div></div>';
 if(!items.length)return h+'<div class="empty">Je hebt nog geen feedback geplaatst. Open een sessie in je planning om feedback toe te voegen.</div>';
 h+='<div style="margin-top:14px">'+items.map(f=>{const w=S.weeks[f.wi];const d=sessDate(f.wi,f.day);return '<div class="card" style="padding:14px 16px;margin-bottom:10px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px">'+(f.rt?'<span class="stars">'+stars(f.rt)+'</span>':"")+'<span class="muted" style="font-size:12px">'+esc(w?w.w:"")+' · '+DAYS[f.day]+' · '+fmtShort(d)+'</span><span class="muted" style="font-size:12px;margin-inline-start:auto">'+esc(f.dt)+'</span></div><div class="muted" style="font-size:12px;margin-bottom:6px">'+esc(firstLine(w?w.s[f.day].t:""))+'</div><div style="font-size:13.5px;white-space:pre-wrap">'+esc(f.c)+'</div><div style="text-align:end;margin-top:6px"><button class="btn ghost sm" data-act="openDay" data-i="'+f.wi+'" data-day="'+f.day+'">Open</button> <button class="btn ghost sm" data-act="delFb" data-fid="'+f.id+'">Verwijderen</button></div></div>';}).join("")+'</div>';
 return h;
}
function kpi(n,l,c){return '<div class="card kpi"><div class="n" style="color:'+(c||"var(--text)")+'">'+n+'</div><div class="l">'+l+'</div></div>';}

/* ================= Event-delegation ================= */
document.addEventListener("click",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,d=t.dataset;
 switch(a){
  case "login": Auth.login(); break;
  case "logout": Auth.logout(); break;
  case "demo": DEMO.current=d.who; boot(); break;
  case "tab": setTab(d.tab); break;
  case "phase": UI.phase=(UI.phase===d.p?"all":d.p); render(); break;
  case "jumpNow": jumpNow(); break;
  case "openDay": openDay(+d.i,+d.day); break;
  case "openTrainee": openTrainee(d.tid); break;
  case "openTraineeDay": UI.viewTrainee=d.tid; UI.tab="trainee"; openDay(+d.i,+d.day); break;
  case "backDash": backDash(); break;
  case "closeDrawer": closeDrawer(); break;
  case "setStatus": setStatus(+d.i,+d.day,d.v); break;
  case "setAtt": setAtt(+d.i,+d.day,d.v); break;
  case "addCal": addToCalendar(+d.i,+d.day); break;
  case "syncWeek": e.stopPropagation(); syncWeek(+d.i); break;
  case "exportAll": exportIcsAll(); break;
  case "rate": setRate(+d.n); break;
  case "submitFb": submitFb(+d.i,+d.day); break;
  case "delFb": delFb(d.fid); break;
  case "exportFb": exportFeedbackCsv(UI.fbTrainee==="all"?null:S.feedback.filter(f=>f.tid===UI.fbTrainee)); break;
 }
});
document.addEventListener("change",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
 if(a==="phaseSel"){UI.phase=t.value;render();}
 else if(a==="fbTrainee"){UI.fbTrainee=t.value;render();}
});
document.addEventListener("input",function(e){
 const t=e.target.closest("[data-act]");if(!t)return;
 if(t.dataset.act==="search"){UI.q=t.value;const wl=document.getElementById("wlist");if(wl)wl.innerHTML=weekListHtml(me.role==="manager"?(UI.viewTrainee||null):me.id, me.role==="manager"&&!UI.viewTrainee);}
});

/* ================= Boot ================= */
function seedInit(){
 S=clone(SEED);
 S.trainees=clone(SEED.demo.trainees);
 S.progress=clone(SEED.demo.progress);
 S.feedback=clone(SEED.demo.feedback);
 delete S.demo;
}
function ensureTrainee(){
 if(me.role!=="trainee")return;
 if(!trainee(me.id))S.trainees.push({id:me.id,name:me.name,email:me.email});
 if(!S.progress[me.id])S.progress[me.id]={};
}
let _authInit=false;
async function boot(){
 if(!S)seedInit();
 if(!_authInit){await Auth.init();_authInit=true;}
 if(!Auth.signedIn()){render();return;}
 me = Auth.mode==="msal" ? (function(){const p=Auth.profile();const c=classify(p.email,p.roles);return {id:p.email,name:p.name,email:p.email,role:c.role,allowed:c.allowed};})() : DEMO.resolve();
 if(!me){render();return;}
 if(me.allowed===false){render();return;}   // aangemeld, maar geen toegang → toon toegangsscherm
 await Store.init();
 await Store.loadAll();
 ensureTrainee();
 UI.tab=me.role==="manager"?"dashboard":"planning";UI.viewTrainee=null;UI.open=null;UI.q="";UI.phase="all";UI.fbTrainee="all";
 render();
}
boot();
